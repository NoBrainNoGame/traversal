<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traversal</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
      #app, canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { touch-action: none; }
      #chat { position: absolute; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); font: 14px system-ui, -apple-system, Segoe UI, sans-serif; color: #e8eaf0; }
      .chat-list { max-height: 210px; overflow-y: auto; padding: 6px 10px; line-height: 1.5; text-shadow: 0 1px 2px #000; overflow-wrap: anywhere; }
      .chat-list:empty { display: none; }
      .chat-list img { height: 28px; vertical-align: middle; }
      .chat-row { display: flex; gap: 6px; }
      .chat-row input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #2b3040; border-radius: 8px; background: rgba(14, 16, 20, 0.82); color: inherit; font: inherit; outline: none; }
      .chat-row input:focus { border-color: #ffe066; }
      .chat-row button, .chat-picker button { border: 0; border-radius: 8px; background: #2b3040; color: inherit; font: inherit; cursor: pointer; }
      .chat-toggle { width: 38px; padding: 4px; }
      .chat-toggle img { width: 26px; vertical-align: middle; }
      .chat-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; padding: 6px; border-radius: 10px; background: rgba(14, 16, 20, 0.9); }
      .chat-picker[hidden] { display: none; }
      .chat-picker button { height: 38px; min-width: 38px; padding: 4px; font-size: 18px; }
      .chat-picker img { height: 30px; }
      #webcams { position: absolute; top: 64px; right: 12px; width: min(280px, 40vw); pointer-events: none; }
      #webcams video { display: block; width: 100%; border-radius: 10px; background: #000; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
      #webcams .webcam-local { transform: scaleX(-1); }
      #webcams video[hidden] { display: none; }
      #webcams .webcam-local { width: 40%; margin: 8px 0 0 auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
      <canvas id="hud" oncontextmenu="return false"></canvas>
    </div>
    <div id="webcams"></div>
    <div id="chat"></div>
    <pre id="crash" style="position:absolute;left:12px;bottom:12px;color:#ff8080;font:13px monospace;white-space:pre-wrap;margin:0"></pre>
    <script>
      // Show startup errors on screen instead of a blank page
      const crash = (msg) => (document.getElementById("crash").textContent += msg + "\n")
      addEventListener("error", (e) => crash(String(e.error ?? e.message) + "\n" + (e.error?.stack ?? "")))
      addEventListener("unhandledrejection", (e) => crash(String(e.reason) + "\n" + (e.reason?.stack ?? "")))
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
